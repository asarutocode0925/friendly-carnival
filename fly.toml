# fly.toml app configuration file generated for friendly-carnival on 2026-10-20T23:32:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'friendly-carnival'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
